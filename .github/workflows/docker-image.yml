name: Publish to Docker Hub - Calldesk Backend

on:
  push:
    branches: [reverse-auction]
  workflow_dispatch:

env:
  IMAGE: saurabhattauctionit/reverse-auction

  # The backend publishes into this same Docker Hub repository, so the tag
  # namespace is shared with it. Every tag this workflow writes — docker and
  # git alike — carries the prefix, so a frontend release can never overwrite
  # `:latest` or a version the backend already published.
  TAG_PREFIX: auction-it-frontend-app-

permissions:
  contents: write

concurrency:
  group: publish-backend
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Read from GitHub → Settings → Variables → Repository variables.
      # Set DOCKER_VERSIONING=true to enable auto-incrementing semver tags and
      # git tags. When unset (or any other value) every push overwrites the
      # fixed latest tag only — no version computation and no git tag.
      # To use a Secret instead: ${{ secrets.DOCKER_VERSIONING || 'false' }}
      VERSIONING: ${{ secrets.DOCKER_VERSIONING || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next backend version
        id: version
        if: env.VERSIONING == 'true'
        run: |
          set -euo pipefail

          latest=$(git tag -l "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)

          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            v=${latest#$TAG_PREFIX}
            major=${v%%.*}
            rest=${v#*.}
            minor=${rest%%.*}
            patch=${rest##*.}
            next="${major}.${minor}.$((patch + 1))"
          fi

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "previous: ${latest:-none}  ->  next: $next"

      - name: Compute image tags
        id: tags
        run: |
          if [ "$VERSIONING" = "true" ]; then
            printf 'tags=%s:%s%s\n%s:%s%s\n' \
              "$IMAGE" "$TAG_PREFIX" "${{ steps.version.outputs.version }}" \
              "$IMAGE" "$TAG_PREFIX" "latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${TAG_PREFIX}latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the version as a git tag
        if: env.VERSIONING == 'true'
        run: |
          set -euo pipefail
          git tag "${TAG_PREFIX}${{ steps.version.outputs.version }}"
          git push origin "${TAG_PREFIX}${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          if [ "$VERSIONING" = "true" ]; then
            {
              echo "### Pushed \`${{ env.IMAGE }}:${{ env.TAG_PREFIX }}${{ steps.version.outputs.version }}\`"
              echo
              echo '```bash'
              echo "docker pull ${{ env.IMAGE }}:${{ env.TAG_PREFIX }}${{ steps.version.outputs.version }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Pushed \`${IMAGE}:${TAG_PREFIX}latest\` (fixed tag, no version bump)"
              echo
              echo '```bash'
              echo "docker pull ${IMAGE}:${TAG_PREFIX}latest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi